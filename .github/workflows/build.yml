name: KnightsCollege Library Diagnostics

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Install Git LFS
        run: git lfs install

      - name: Clone KnightsCollege
        run: |
          git clone https://huggingface.co/datasets/user3671/knights-college KnightsCollege
          cd KnightsCollege
          git lfs pull

      - name: Inspect native libraries
        run: |
          echo "=== Static libraries ==="
          find KnightsCollege -name "*.a" -type f -print0 |
          while IFS= read -r -d '' file; do
            echo ""
            echo "FILE: $file"
            file "$file"
            xcrun lipo -info "$file" 2>&1 || true
          done

      - name: Inspect frameworks
        run: |
          find KnightsCollege -name "*.framework" -type d |
          while read framework; do
            echo ""
            echo "FRAMEWORK: $framework"
            find "$framework" -maxdepth 2 -type f -exec file {} \;
          done

      - name: Inspect project settings
        run: |
          grep -nE 'SDKROOT|SUPPORTED_PLATFORMS|ARCHS|VALID_ARCHS|IPHONEOS_DEPLOYMENT_TARGET|TARGETED_DEVICE_FAMILY' \
          KnightsCollege/Unity-iPhone.xcodeproj/project.pbxproj || true

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: KnightsCollege-Library-Report
          path: KnightsCollege
          if-no-files-found: warn
          retention-days: 3
