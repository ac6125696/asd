name: KnightsCollege Library Report

on:
  workflow_dispatch:

jobs:
  inspect:
    runs-on: macos-15-intel
    timeout-minutes: 360

    steps:
      - name: Install Git LFS
        run: git lfs install

      - name: Clone KnightsCollege
        run: |
          git clone https://huggingface.co/datasets/user3671/knights-college KnightsCollege
          cd KnightsCollege
          git lfs pull

      - name: Generate library report
        run: |
          REPORT="$RUNNER_TEMP/library-report.txt"

          echo "KNIGHTSCOLLEGE LIBRARY REPORT" > "$REPORT"

          find KnightsCollege -name "*.a" -type f -print0 |
          while IFS= read -r -d '' file; do
            {
              echo ""
              echo "FILE: $file"
              file "$file"
              xcrun lipo -info "$file" 2>&1 || true
            } >> "$REPORT"
          done

          cat "$REPORT"

      - name: Upload report only
        uses: actions/upload-artifact@v4
        with:
          name: KnightsCollege-Library-Report
          path: ${{ runner.temp }}/library-report.txt
          retention-days: 3
